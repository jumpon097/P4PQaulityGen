    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
        
        body { font-family: 'Sarabun', sans-serif; background-color: #f3f4f6; }

        /* การตั้งค่าสำหรับการพิมพ์ให้เหมือน PDF ต้นฉบับ */
        @media print {
            body { background-color: white; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .no-print { display: none !important; }
            .page-container { padding: 0 !important; margin: 0 !important; box-shadow: none !important; width: 100% !important; max-width: 100% !important; }
            
            /* แบ่งหน้ากระดาษ */
            .page-break { page-break-before: always; }
            .avoid-break { page-break-inside: avoid; }
            
            @page { size: A4 portrait; margin: 15mm 12mm; }
            
            .print-table th, .print-table td { padding: 4px 6px !important; font-size: 13px !important; border: 1px solid #000; }
        }

        .table-borders th, .table-borders td { border: 1px solid #d1d5db; }
        .print-table th, .print-table td { border: 1px solid #000; }
        
        /* Custom Input */

        .input-qty:focus { outline: 2px solid #3b82f6; }
    </style>

            { code: "AM 20", category: "กิจกรรมงานพัฒนาคุณภาพ ของภารกิจ", name: "ประชุมการจัดความเสี่ยงภายในกลุ่มงาน", unit: "ครั้ง", time: 30 }
        ];

        // ฟังก์ชันบีบอัดรูปภาพหลักฐาน
        const compressImage = (file) => {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 1200; // ปรับขนาดให้ใหญ่ขึ้นเล็กน้อยเพื่อให้ภาพชัดเจนใน PDF
                        let width = img.width;
                        let height = img.height;
                        if (width > MAX_WIDTH) { height = Math.round((height * MAX_WIDTH) / width); width = MAX_WIDTH; }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.8));
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });
        };

        function App() {
            const [step, setStep] = React.useState(1);
            const [printZoom, setPrintZoom] = React.useState(100);
            const [showSettings, setShowSettings] = React.useState(false);

            // ข้อมูลผู้ใช้งาน, เรทคะแนน และโลโก้
            const [userInfo, setUserInfo] = React.useState(() => {
                const saved = localStorage.getItem('p4p_qual_user');
                return saved ? JSON.parse(saved) : {
                    hospitalName: "โรงพยาบาลมะเร็งอุบลราชธานี",
                    name: "นายจุมพล อุทธา",
                    position: "เภสัชกรชำนาญการ",
                    department: "กลุ่มงานเภสัชกรรม",
                    mission: "ภารกิจด้านวิชาการและการแพทย์",
                    period: "๑ มกราคม - ๓๑ มีนาคม พ.ศ. ๒๕๖๙",
                    year: "2569",
                    rate: 0.171, // ค่าตั้งต้นคะแนนต่อนาที
                    logo: null // เก็บ Base64 ของโลโก้
                };
            });

            // ข้อมูลภาระงาน
            const [tasks, setTasks] = React.useState(() => {
                const saved = localStorage.getItem('p4p_qual_tasks');
                if (saved) {
                    let parsed = JSON.parse(saved);
                    // Migrate string images to object { url, caption } for backward compatibility
                    parsed = parsed.map(t => ({
                        ...t,
                        images: (t.images || []).map(img => typeof img === 'string' ? { url: img, caption: '' } : img)
                    }));
                    return parsed;
                }
                return DEFAULT_TASKS.map(t => ({ ...t, qty: 0, images: [] }));
            });

            React.useEffect(() => { localStorage.setItem('p4p_qual_user', JSON.stringify(userInfo)); }, [userInfo]);
            React.useEffect(() => { localStorage.setItem('p4p_qual_tasks', JSON.stringify(tasks)); }, [tasks]);

            const handleUserInfo = (e) => {
                const { name, value } = e.target;
                setUserInfo(prev => ({ ...prev, [name]: value }));
            };

            const handleRateChange = (e) => {
                let val = parseFloat(e.target.value);
                setUserInfo(prev => ({ ...prev, rate: isNaN(val) ? 0 : val }));
            };

            const handleLogoUpload = (e) => {
                const file = e.target.files[0];
                if(!file) return;
                if(file.size > 2 * 1024 * 1024) {
                    alert('ขนาดไฟล์โลโก้ใหญ่เกินไป กรุณาใช้ไฟล์ขนาดไม่เกิน 2MB');
                    return;
                }
                const reader = new FileReader();
                reader.onload = (event) => {
                    setUserInfo(prev => ({ ...prev, logo: event.target.result }));
                };
                reader.readAsDataURL(file);
            };

            const removeLogo = () => {
                if(confirm('ต้องการลบโลโก้ใช่หรือไม่?')) setUserInfo(prev => ({ ...prev, logo: null }));
            };

            const handleQtyChange = (index, value) => {
                let parsed = parseInt(value);
                if (isNaN(parsed) || parsed < 0) parsed = 0;
                const newTasks = [...tasks];
                newTasks[index].qty = parsed;
                setTasks(newTasks);
            };

            const handleTimeChange = (index, value) => {
                let parsed = parseInt(value);
                if (isNaN(parsed) || parsed < 0) parsed = 0;
                const newTasks = [...tasks];
                newTasks[index].time = parsed;
                setTasks(newTasks);
            };

            const handleImageUpload = async (index, e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;
                const btn = e.target.parentElement;
                const originalHtml = btn.innerHTML;
                btn.innerHTML = '<span class="text-xs">กำลังย่อรูป...</span>';
                
                // บีบอัดรูปและแปลงเป็น Object ที่มี caption
                const compressedImages = await Promise.all(files.map(f => compressImage(f)));
                const newImageObjects = compressedImages.map(url => ({ url: url, caption: '' }));
                
                const newTasks = [...tasks];
                newTasks[index].images = [...(newTasks[index].images || []), ...newImageObjects];
                setTasks(newTasks);
                btn.innerHTML = originalHtml;
                e.target.value = '';
            };

            const handleCaptionChange = (taskIndex, imgIndex, value) => {
                const newTasks = [...tasks];
                newTasks[taskIndex].images[imgIndex].caption = value;
                setTasks(newTasks);
            };

            const removeImage = (taskIndex, imgIndex) => {
                if(!confirm("ต้องการลบรูปหลักฐานนี้ใช่หรือไม่?")) return;
                const newTasks = [...tasks];
                newTasks[taskIndex].images.splice(imgIndex, 1);
                setTasks(newTasks);
            };

            const clearData = () => {
                if(confirm("ต้องการล้างข้อมูลจำนวนงานและรูปภาพทั้งหมดใช่หรือไม่?")) {
                    const newTasks = tasks.map(t => ({ ...t, qty: 0, images: [] }));
                    setTasks(newTasks);
                }
            };

            const handleTaskEdit = (index, field, value) => {
                const newTasks = [...tasks];
                if (field === 'time') newTasks[index][field] = parseInt(value) || 0;
                else newTasks[index][field] = value;
                setTasks(newTasks);
            };

            const addTask = () => {
                setTasks([...tasks, { code: "NEW 01", category: "หมวดหมู่ใหม่", name: "กิจกรรมใหม่", unit: "ครั้ง", time: 0, qty: 0, images: [] }]);
            };

            const deleteTask = (index) => {
                if (confirm("ต้องการลบภาระงานนี้ใช่หรือไม่? (รูปที่แนบไว้จะหายไปด้วย)")) {
                    const newTasks = [...tasks];
                    newTasks.splice(index, 1);
                    setTasks(newTasks);
                }
            };

            const exportExcel = () => {
                const exportData = tasks.map(t => ({
                    "CODE": t.code, "หมวดหมู่": t.category, "กิจกรรม": t.name, "หน่วยนับ": t.unit, "เวลาที่ใช้(นาที)": t.time
                }));
                const ws = XLSX.utils.json_to_sheet(exportData);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Tasks");
                XLSX.writeFile(wb, "P4P_Qualitative_Template.xlsx");
            };

            const importExcel = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const bstr = evt.target.result;
                        const wb = XLSX.read(bstr, { type: 'binary' });
                        const wsname = wb.SheetNames[0];
                        const ws = wb.Sheets[wsname];
                        const rows = XLSX.utils.sheet_to_json(ws, { header: 1 });
                        
                        let newTasks = [];
                        let currentCategory = "หมวดหมู่ทั่วไป";
                        let headerFound = false;
                        let cIdx = -1, nIdx = -1, uIdx = -1, tIdx = -1, catIdx = -1;

                        for (let i = 0; i < rows.length; i++) {
                            const row = rows[i];
                            if (!row || row.length === 0) continue;
                            if (!headerFound) {
                                for (let j = 0; j < row.length; j++) {
                                    const cell = String(row[j] || "").trim().toUpperCase();
                                    if (cell === "CODE") cIdx = j;
                                    if (cell.includes("กิจกรรม") || cell.includes("รายการ")) nIdx = j;
                                    if (cell.includes("หน่วย")) uIdx = j;
                                    if (cell.includes("เวลา")) tIdx = j;
                                    if (cell.includes("หมวดหมู่")) catIdx = j;
                                }
                                if (cIdx !== -1 && nIdx !== -1) headerFound = true;
                            } else {
                                const codeStr = String(row[cIdx] || "").trim();
                                if (cIdx !== -1 && codeStr && codeStr !== "undefined" && codeStr !== "null" && codeStr !== "") {
                                    const nameStr = String(row[nIdx] || "").trim();
                                    const unitStr = String(row[uIdx] || "ครั้ง").trim();
                                    const timeVal = parseInt(row[tIdx]) || 0;
                                    if (catIdx !== -1 && row[catIdx] && String(row[catIdx]).trim() !== "") currentCategory = String(row[catIdx]).trim();
                                    
                                    const existing = tasks.find(t => t.code === codeStr);
                                    newTasks.push({
                                        code: codeStr, category: currentCategory, name: nameStr, unit: unitStr, time: timeVal,
                                        qty: existing ? existing.qty : 0, images: existing ? existing.images : []
                                    });
                                } else {
                                    let catName = "";
                                    for(let j=0; j<row.length; j++) { if(row[j] && String(row[j]).trim() !== "") catName += String(row[j]).trim() + " "; }
                                    catName = catName.trim();
                                    if(catName && !catName.includes("รวม") && !catName.includes("คะแนน") && !catName.includes("บาท")) currentCategory = catName;
                                }
                            }
                        }
                        if(newTasks.length > 0) { setTasks(newTasks); alert(`อัปเดตภาระงานสำเร็จ! พบทั้งหมด ${newTasks.length} รายการ`); } 
                        else { alert("รูปแบบไฟล์ไม่ถูกต้อง หรือไม่พบคอลัมน์ 'CODE' และ 'กิจกรรม' ในไฟล์ Excel"); }

                                <div className="bg-white p-12 shadow-lg page-container page-break relative" style={{width: '210mm', minHeight: '297mm', boxSizing: 'border-box'}}>
                                    {activeTasks.map((task, idx) => (
                                        <div key={`ev-${idx}`} className="mb-10 avoid-break border-b border-gray-200 pb-8 last:border-0">
                                            
                                            {/* หัวข้อกิจกรรม */}
                                            <h3 className="text-[16px] font-bold mb-6 text-gray-900 leading-relaxed">
                                                {idx+1}. {task.name} {task.qty > 0 ? `${task.qty} ${task.unit}` : ''} {task.code}
                                            </h3>

                                            {/* รูปภาพและคำบรรยาย (Figure) */}
                                            <div className="flex flex-col gap-8 items-center">
                                                {task.images && task.images.map((imgObj, imgIdx) => (
                                                    <div key={imgIdx} className="w-full text-center">
                                                        <img src={imgObj.url} className="max-w-full h-auto object-contain max-h-[600px] mx-auto border border-gray-200 shadow-sm p-1 bg-white" alt={`evidence-${idx}-${imgIdx}`} />
                                                        {imgObj.caption ? (
                                                            <p className="text-center text-[14px] text-gray-700 mt-3 font-medium italic">{imgObj.caption}</p>
                                                        ) : (
                                                            <p className="text-center text-[12px] text-gray-400 mt-2 font-mono">รูปประกอบที่ {imgIdx + 1}</p>
                                                        )}
                                                    </div>
                                                ))}
                                                
                                                {/* กรณีระบุจำนวนงานแต่ไม่ได้แนบรูป */}
                                                {(!task.images || task.images.length === 0) && (
                                                    <div className="h-24 w-full flex items-center justify-center border-2 border-dashed border-gray-200 rounded text-gray-400 text-sm italic">
                                                        (ระบุผลงานว่าดำเนินการแล้ว แต่ไม่ได้แนบรูปภาพอ้างอิงในระบบ)
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    ))}

                                    {activeTasks.length === 0 && (
                                        <div className="flex flex-col items-center justify-center h-64 text-gray-400 no-print">
                                            <i data-lucide="image-off" className="w-16 h-16 mb-4 opacity-50"></i>
                                            <p className="text-lg">ยังไม่มีการลงบันทึกผลงาน</p>
                                            <p className="text-sm mt-2">กรุณากลับไปที่ขั้นตอนที่ 1 เพื่อกรอกจำนวนงานหรือแนบรูปภาพ</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Developer Credit Footer */}
                    <div className="text-center py-6 text-gray-500 text-sm no-print mt-auto bg-gray-200/50 border-t border-gray-300">
                        <p className="font-semibold text-gray-600">พัฒนาโดย: ภก.จุมพล อุทธา หัวหน้างานคลังยาและเภสัชสารสนเทศ</p>
                        <p>กลุ่มงานเภสัชกรรม โรงพยาบาลมะเร็งอุบลราชธานี</p>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        setTimeout(() => lucide.createIcons(), 500);
    </script>
</body>
</html>
